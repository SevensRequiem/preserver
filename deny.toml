[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 timing issues; pinned by age's p256 (elliptic-curve 0.13), used only for p256-tag plugin recipients, which preserver never uses (X25519 and scrypt only)" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained, merged into zbus 6; revisit when zbus moves to 6.x" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained, merged into zbus 6; revisit when zbus moves to 6.x" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained, merged into zbus 6; revisit when zbus moves to 6.x" },
    { id = "RUSTSEC-2026-0374", reason = "basic-toml unmaintained, pulled in by age's i18n; drop when age does" },
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9 Marvin attack: a timing leak in private-key operations (decrypt, sign). preserver holds no RSA private key; rsa only verifies OpenPGP signatures with public keys, through pgp, which needs rsa 0.9 (the fix is 0.10)" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "cc", wrappers = ["ring"], reason = "no new C build dependencies; ring is the only audited exception" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
