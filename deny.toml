[graph]
# The GUI tree (feature "gui") is checked too.
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 timing issues; pinned by age's p256 (elliptic-curve 0.13), used only for p256-tag plugin recipients, which preserver never uses (X25519 and scrypt only)" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained, merged into zbus 6; revisit when zbus moves to 6.x" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained, merged into zbus 6; revisit when zbus moves to 6.x" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained, merged into zbus 6; revisit when zbus moves to 6.x" },
    { id = "RUSTSEC-2026-0374", reason = "basic-toml unmaintained, pulled in by age's i18n; drop when age does" },
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9 Marvin attack: a timing leak in private-key operations (decrypt, sign). verify only, public keys (Alpine signatures and, through pgp, OpenPGP ones; pgp needs rsa 0.9, the fix is 0.10); private keys only in tests" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "Zlib",
]
confidence-threshold = 0.9
# Mozilla's root store as data; only this crate may use the data license.
exceptions = [
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    # egui's bundled fonts (Ubuntu-Light, Hack, emoji-icon-font); the texts ship in dist/licenses/.
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
    # Windows clipboard for the GUI (arboard <- egui-winit); Boost license, permissive.
    { crate = "clipboard-win", allow = ["BSL-1.0"] },
    { crate = "error-code", allow = ["BSL-1.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "cc", wrappers = ["ring", "wayland-backend"], reason = "no new C build dependencies; ring is the audited exception, and wayland-backend's build.rs compiles C only with its log feature, which preserver leaves off" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
