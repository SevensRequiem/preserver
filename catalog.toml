# Sets run in this order with --first-pass. Otherwise they run by priority, lowest first; `preserver copy`
# fills a smaller target in the same order and drops the highest numbers first.
# A [[set.variant]] names a subset of the sources that `preserver copy` takes when the whole set does not
# fit. Every set also has an implicit "full" variant with all its sources, unless one is named "full".
# estimate and est are GB. Sizes marked (E) are guesses.
# keep is how many set versions stay visible. Unchanged files are hard links, so it only costs what changed.
# A disabled source needs a todo that says what is missing.

