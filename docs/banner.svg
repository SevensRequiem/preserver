    <path d="M0 268 Q 320 240 640 262 T 1280 250 V320 H0Z" fill="#0c1116" fill-opacity="0.55"/>
    <path d="M0 290 Q 360 270 700 288 T 1280 280 V320 H0Z" fill="#0a0e12" fill-opacity="0.7"/>
  </g>

  <g transform="translate(150 70)">
    <rect x="0" y="120" width="190" height="52" rx="10" fill="url(#slab)" stroke="#3e5160" stroke-width="2"/>
    <rect x="0" y="62" width="190" height="52" rx="10" fill="url(#slab)" stroke="#3e5160" stroke-width="2"/>
    <rect x="0" y="4" width="190" height="52" rx="10" fill="url(#slab)" stroke="#4a6070" stroke-width="2"/>
    <g fill="#5b7282">
      <rect x="20" y="141" width="70" height="8" rx="4"/>
      <rect x="20" y="83" width="70" height="8" rx="4"/>
      <rect x="20" y="25" width="70" height="8" rx="4"/>
    </g>
    <circle cx="150" cy="146" r="6" fill="#4fb38a"/>
    <circle cx="150" cy="88" r="6" fill="#4fb38a"/>
    <circle cx="150" cy="30" r="6" fill="url(#amber)"/>
    <g transform="translate(196 112)">
      <path d="M-22 4 a22 22 0 0 1 44 0 v10 h-10 v-10 a12 12 0 0 0 -24 0 v10 h-10z" fill="#d7dee4"/>
      <rect x="-30" y="12" width="60" height="48" rx="8" fill="url(#amber)" stroke="#10161d" stroke-width="3"/>
      <circle cx="0" cy="31" r="6" fill="#10161d"/>
      <rect x="-3" y="33" width="6" height="14" rx="3" fill="#10161d"/>
    </g>
  </g>

  <g font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', SFMono-Regular, Menlo, Consolas, monospace">
    <text x="420" y="160" font-size="86" font-weight="700" fill="#e8edf1" letter-spacing="-1">preserver</text>
    <rect x="424" y="182" width="96" height="5" rx="2.5" fill="url(#amber)"/>
    <text x="424" y="226" font-size="24" fill="#9fb0bd">encrypted backups and an offline archive,</text>
