# Install as ~/.config/preserver/config.toml (Linux) or
# %APPDATA%\preserver\config.toml (Windows). The repo ships no host defaults.

# GitHub owners (users or orgs) whose repositories are backed up. Required.
owners = ["your-github-user", "your-org"]

# Filesystem id of the primary backup drive (ext4 UUID, FAT "XXXX-XXXX" or NTFS serial). Required.
primary_uuid = "00000000-0000-0000-0000-000000000000"

# "ssh" (FIDO key through the preserver-ssh shim) or "https" (token from the gh CLI). Override with --transport.
# The tray's "GitHub transport" menu rewrites this one line and leaves the rest of the file alone.
transport = "ssh"

# Public-archive download cap in Mbit/s; 0 means no cap.
bandwidth_mbit = 80

# Percent of the drive kept free by the public-archive budget (0 to 90).
reserve_percent = 10

# Local folders, each backed up to <drive>/preserver/local-personal/<name>/YYYY-MM/ as a full
# L0.tar.zst.age once a month and a differential Dnn.tar.zst.age on every later run. The name is
# letters, digits, ".", "_" and "-"; the path is absolute. Symlinks are stored as links, and
# sockets, FIFOs and devices are left out. Repeat the block for more folders.
[[local]]
name = "documents"
path = "/home/you/Documents"

# Copies to other drives are not configured here. 'preserver copy TARGET -t 24:00:00' keeps a
# rule in copy.toml next to this file, which the daemon runs; 'copy --list' and 'copy --remove'
# manage the rules. That file is written by preserver: edit it only through those commands.
